<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS">
<title>Pop-up POS</title>
<style>
:root{--ink:#1c1b19;--tp:#8a857c;--st:#dcd8d0;--bg:#f3f1ed;--wh:#fcfbf9;--ac:#9a7b4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;font-weight:400;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column;user-select:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
header{display:flex;align-items:center;gap:6px;padding:14px 24px;border-bottom:1px solid var(--st)}
header h1{font-size:19px;font-weight:300;letter-spacing:.14em;margin:0 auto 0 0}
.tab{padding:8px 14px;color:var(--tp);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--ac)}
#badge{font-size:13px;color:var(--tp);margin-right:12px}#badge.w{color:var(--ac)}
main{flex:1;overflow:auto;padding:18px 24px}
.sell{display:grid;grid-template-columns:1fr 380px;gap:20px;height:100%}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-content:start;overflow:auto}
.tile{position:relative;height:122px;border-radius:14px;background:var(--wh);border:1px solid var(--st);text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between;font-size:19px;font-weight:500}
.tile span{font-size:16px;color:var(--tp);font-weight:300}.tile:active{background:#ebe8e2}
.tile i{position:absolute;top:12px;right:12px;background:var(--ink);color:var(--wh);font-style:normal;font-size:14px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;padding:0 8px}
.cart{background:var(--wh);border:1px solid var(--st);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.ln{display:grid;grid-template-columns:1fr auto 72px;gap:10px;align-items:center}
.ln span:last-child{text-align:right}
.q{display:flex;align-items:center;gap:10px}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--st);font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:28px;font-weight:300;border-top:1px solid var(--st);padding-top:14px;margin-top:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--st);border-radius:12px;overflow:hidden}
.seg button{padding:12px}.seg button.on{background:var(--ink);color:var(--wh)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:9px 14px;border:1px solid var(--st);border-radius:99px;font-size:14px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--st);width:100%;background:#fff;color:var(--ink);user-select:text}
#go,.pri{padding:17px;border-radius:12px;background:var(--ink);color:var(--wh);font-size:18px;letter-spacing:.04em}
#go:disabled{opacity:.3}
.muted{color:var(--tp);font-size:14px}
.card{background:var(--wh);border:1px solid var(--st);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.sm{padding:9px 16px;border-radius:10px;border:1px solid var(--st);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stats div{background:var(--wh);border:1px solid var(--st);border-radius:14px;padding:14px;color:var(--tp);font-size:14px}.stats b{display:block;font-size:26px;font-weight:300;color:var(--ink)}
.void{opacity:.4;text-decoration:line-through}
label.t{display:flex;gap:10px;align-items:center;margin-top:8px}label.t input{width:auto}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--wh);padding:13px 24px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(28,27,25,.55);display:none;align-items:center;justify-content:center;z-index:5;padding:20px}
#modal.on{display:flex}
.pane{background:var(--bg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:100%;width:380px}
#rc{background:#fff;padding:22px 20px;overflow:auto;font-size:14px;border:1px solid var(--st)}
#rc .c{text-align:center}#rc .big{font-size:18px;letter-spacing:.14em;font-weight:300;margin-bottom:2px}
#rc .k{display:flex;justify-content:space-between;gap:10px;margin:4px 0}#rc .b{font-weight:600;font-size:16px}
#rc hr{border:0;border-top:1px dashed #bbb;margin:10px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .pri{grid-column:1/-1}
@media(max-width:820px){.sell{grid-template-columns:1fr;height:auto}}
@media print{@page{size:80mm auto;margin:4mm}body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:100%;border:0;padding:0;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1 id="ttl"></h1><span id="badge"></span>
<button class="tab" data-v="sell">Sell</button><button class="tab" data-v="orders">Today</button><button class="tab" data-v="cost">Costing</button><button class="tab" data-v="setup">Setup</button></header>
<main id="app"></main><div id="toast"></div>
<div id="modal"><div class="pane"><div id="rc"></div><div class="acts"><button class="sm" onclick="window.print()">Print</button><button class="sm" onclick="shareRc()">Share (paperless)</button><button class="pri" onclick="closeRc()">Done</button></div></div></div>
<script>
const K='sarapPOS1',$=s=>document.querySelector(s);
const DEF=[['Lumpia Solo',60],['Lumpia Duo',110],['Lumpia Group',300],['Rice',20],['Bottled Water',25],['Soda (can)',50]];
let S=load(),view='sell',cart={},pay='Cash',given='',ref='',rcOrder=null;
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
 return Object.assign({menu:DEF.map((m,i)=>({id:'m'+i,name:m[0],price:m[1]})),orders:[],url:'',counter:0,day:'',auto:true,ing:[],rec:{},fx:[],margin:50,mi:{},goal:0,biz:{name:'Your Shop Name',line:'',foot:'Thank you!'}},d||{})}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Could not save on this iPad. Tap Setup, then Export CSV, right now.')}}
const P=n=>'₱'+Number(n).toLocaleString('en-PH'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const lines=()=>S.menu.filter(m=>cart[m.id]).map(m=>({id:m.id,name:m.name,price:m.price,qty:cart[m.id]}));
const total=()=>lines().reduce((a,i)=>a+i.price*i.qty,0);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function badge(){const n=S.orders.filter(o=>!o.synced).length,b=$('#badge');
 b.className=n?'w':'';b.textContent=!S.url?'Saved on iPad only':n?(navigator.onLine?n+' syncing…':'Offline · '+n+' saved'):'All synced'}
function add(id){cart[id]=(cart[id]||0)+1;render()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
function setPay(p){pay=p;render()}
function setGiven(v){given=v;calc()}
function calc(){const t=total(),g=pay==='Cash'?(given===''?t:+given):t,ch=g-t,go=$('#go');
 if(!go)return;const c=$('#chg');if(c)c.textContent=given===''?'Exact amount':ch<0?'Short by '+P(-ch):'Change '+P(ch);
 go.disabled=!t||g<t;go.textContent=t?'Charge '+P(t):'Charge'}
function sellView(){const t=total();
 return`<div class="sell"><div class="menu">${S.menu.map(m=>`<button class="tile" onclick="add('${m.id}')"><b style="font-weight:500">${esc(m.name)}</b><span>${P(m.price)}</span>${cart[m.id]?`<i>${cart[m.id]}</i>`:''}</button>`).join('')}</div>
 <aside class="cart">${lines().map(l=>`<div class="ln"><span>${esc(l.name)}</span><span class="q"><button onclick="chg('${l.id}',-1)">−</button>${l.qty}<button onclick="chg('${l.id}',1)">+</button></span><span>${P(l.price*l.qty)}</span></div>`).join('')||'<p class="muted">Tap an item to start an order.</p>'}
 <div class="tot"><span>Total</span><span>${P(t)}</span></div>
 <div class="seg"><button class="${pay=='Cash'?'on':''}" onclick="setPay('Cash')">Cash</button><button class="${pay=='GCash'?'on':''}" onclick="setPay('GCash')">GCash</button></div>
 ${pay=='Cash'?`<div class="chips"><button class="chip" onclick="given='';render()">Exact</button>${[100,200,500,1000].map(n=>`<button class="chip" onclick="given=${n};render()">${P(n)}</button>`).join('')}</div>
 <input type="number" inputmode="numeric" placeholder="Cash given" value="${given}" oninput="setGiven(this.value)"><div id="chg" class="muted"></div>`
 :`<input placeholder="GCash ref no. (optional)" value="${esc(ref)}" oninput="ref=this.value">`}
 <button id="go" onclick="charge()">Charge</button>
 ${t?'<button class="sm" onclick="cart={};given=\'\';render()">Clear order</button>':''}</aside></div>`}
function charge(){const it=lines().map(({name,price,qty})=>({name,price,qty})),t=total();if(!it.length)return;const g=pay==='Cash'?(given===''?t:+given):t;if(g<t)return;
 const d=new Date(),day=today();if(S.day!==day){S.day=day;S.counter=0}S.counter++;
 const o={id:day+'-'+S.counter+'-'+Math.random().toString(36).slice(2,6),no:S.counter,date:day,time:d.toLocaleTimeString('en-GB'),items:it,total:t,pay,given:g,change:g-t,ref:pay=='GCash'?ref:'',void:false,synced:false};
 S.orders.push(o);save();cart={};given='';ref='';render();sync();
 if(S.auto)showRc(o.id);else toast('Order #'+o.no+' saved'+(o.change>0?' · change '+P(o.change):''))}
// receipt: one description used for screen, text and image
function rcRows(o){const r=[{t:'big',a:S.biz.name}];if(S.biz.line)r.push({t:'c',a:S.biz.line});
 r.push({t:'hr'},{t:'kv',a:'Order #'+o.no,b:o.date+'  '+o.time},{t:'hr'});
 o.items.forEach(i=>r.push({t:'kv',a:i.qty+' × '+i.name,b:P(i.qty*i.price)}));
 r.push({t:'hr'},{t:'kv',a:'Total',b:P(o.total),bold:1},{t:'kv',a:'Paid by '+o.pay,b:''});
 if(o.pay=='Cash'){r.push({t:'kv',a:'Cash',b:P(o.given)},{t:'kv',a:'Change',b:P(o.change)})}else if(o.ref)r.push({t:'kv',a:'Ref',b:o.ref});
 if(o.void)r.push({t:'c',a:'VOIDED'});if(S.biz.foot)r.push({t:'hr'},{t:'c',a:S.biz.foot});return r}
function showRc(id){const o=S.orders.find(x=>x.id===id);rcOrder=o;
 $('#rc').innerHTML=rcRows(o).map(r=>r.t=='hr'?'<hr>':r.t=='kv'?`<div class="k ${r.bold?'b':''}"><span>${esc(r.a)}</span><span>${esc(r.b)}</span></div>`:`<div class="c ${r.t=='big'?'big':''}">${esc(r.a)}</div>`).join('');
 $('#modal').classList.add('on')}
function closeRc(){$('#modal').classList.remove('on')}
async function shareRc(){const rows=rcRows(rcOrder),W=480,s=2,c=document.createElement('canvas'),x=c.getContext('2d');
 const H=rows.reduce((a,r)=>a+(r.t=='hr'?24:r.t=='big'?48:34),60);c.width=W*s;c.height=H*s;x.scale(s,s);
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#1c1b19';let y=44;
 rows.forEach(r=>{const f=n=>x.font=n+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
  if(r.t=='hr'){x.fillStyle='#bbb';x.fillRect(32,y-12,W-64,1);x.fillStyle='#1c1b19';y+=24}
  else if(r.t=='big'){f('300 26');x.textAlign='center';x.fillText(r.a,W/2,y);y+=48}
  else if(r.t=='c'){f('18');x.textAlign='center';x.fillText(r.a,W/2,y);y+=34}
  else{f((r.bold?'600 22':'20'));x.textAlign='left';x.fillText(r.a,32,y);x.textAlign='right';x.fillText(r.b,W-32,y);y+=34}});
 c.toBlob(async b=>{const f=new File([b],'receipt-'+rcOrder.no+'.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Receipt #'+rcOrder.no});
   else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}}catch(e){}})}
function ordersView(){const os=S.orders.filter(o=>o.date===today()),ok=os.filter(o=>!o.void),sum=p=>ok.filter(o=>!p||o.pay===p).reduce((a,o)=>a+o.total,0),sold={};
 ok.forEach(o=>o.items.forEach(i=>sold[i.name]=(sold[i.name]||0)+i.qty));
 return`<div class="stats"><div>Sales<b>${P(sum())}</b></div><div>Cash<b>${P(sum('Cash'))}</b></div><div>GCash<b>${P(sum('GCash'))}</b></div><div>Orders<b>${ok.length}</b></div></div>
 <div class="card"><b style="font-weight:500">Sold today</b><div class="muted">${Object.entries(sold).map(([k,v])=>esc(k)+' × '+v).join(' · ')||'Nothing yet'}</div></div>
 ${os.slice().reverse().map(o=>`<div class="card ${o.void?'void':''}"><div class="row"><b style="font-weight:500">#${o.no}</b><span class="muted">${o.time} · ${o.pay} · ${o.synced?'synced':'waiting'}</span><b style="margin-left:auto;font-weight:500">${P(o.total)}</b><button class="sm" onclick="showRc('${o.id}')">Receipt</button><button class="sm" onclick="voidOrder('${o.id}')">${o.void?'Restore':'Void'}</button></div><div class="muted">${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</div></div>`).join('')||'<p class="muted">No orders yet today.</p>'}`}
function voidOrder(id){const o=S.orders.find(x=>x.id===id);if(!confirm((o.void?'Restore':'Void')+' order #'+o.no+'?'))return;o.void=!o.void;o.synced=false;save();render();sync()}
function setupView(){const b=S.biz;return`<div class="card"><b style="font-weight:500">Business and receipt</b><div class="row" style="margin-top:10px"><input placeholder="Business name" value="${esc(b.name)}" onchange="S.biz.name=this.value;save();render()"></div>
 <div class="row"><input placeholder="Line under the name (IG handle, contact, address)" value="${esc(b.line)}" onchange="S.biz.line=this.value;save()"></div>
 <div class="row"><input placeholder="Footer message" value="${esc(b.foot)}" onchange="S.biz.foot=this.value;save()"></div>
 <label class="t"><input type="checkbox" ${S.auto?'checked':''} onchange="S.auto=this.checked;save()">Show receipt after every sale</label></div>
 <div class="card"><b style="font-weight:500">Menu</b>${S.menu.map((m,i)=>`<div class="row" style="margin-top:8px"><input value="${esc(m.name)}" onchange="S.menu[${i}].name=this.value;save()"><input type="number" inputmode="decimal" style="width:110px" value="${m.price}" onchange="S.menu[${i}].price=+this.value||0;save()"><button class="sm" onclick="delItem(${i})">Remove</button></div>`).join('')}
 <button class="sm" onclick="S.menu.push({id:'m'+Date.now(),name:'New item',price:0});save();render()">Add item</button></div>
 <div class="card"><b style="font-weight:500">Google Sheet link</b><p class="muted">Paste the Web app URL from Apps Script. Orders sync whenever the iPad has signal.</p><input placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.url)}" onchange="S.url=this.value.trim();save();sync()">
 <div class="row" style="margin-top:10px"><button class="sm" onclick="sync(true)">Sync now</button><button class="sm" onclick="exportCSV()">Export CSV backup</button></div></div>`}
function delItem(i){if(!confirm('Remove '+S.menu[i].name+'?'))return;delete cart[S.menu[i].id];S.menu.splice(i,1);save();render()}
async function sync(manual){badge();const q=S.orders.filter(o=>!o.synced);if(!S.url||!q.length||!navigator.onLine){if(manual)toast(!S.url?'Add the sheet link first':!navigator.onLine?'Offline. Will sync later':'Nothing to sync');return}
 try{await fetch(S.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({orders:q})});q.forEach(o=>o.synced=true);save();if(manual)toast('Synced '+q.length+' orders')}catch(e){if(manual)toast('Sync failed. Will retry')}
 badge();if(view=='orders')render()}
function exportCSV(){const r=[['Order #','Date','Time','Item','Qty','Price','Line total','Payment','Status']];
 S.orders.forEach(o=>o.items.forEach(i=>r.push([o.no,o.date,o.time,i.name,i.qty,i.price,i.qty*i.price,o.pay,o.void?'VOID':'OK'])));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='sales-'+today()+'.csv';a.click()}

const R=n=>'₱'+(Math.round(n*100)/100).toLocaleString('en-PH');
const ic=g=>{const i=S.ing.find(x=>x.id===g);return i&&+i.qty>0?i.cost/i.qty:0};
const itemCost=id=>(S.rec[id]||[]).reduce((a,r)=>a+ic(r.ing)*r.qty,0);
const mg=id=>S.mi[id]!=null?S.mi[id]:S.margin;
const sug=id=>{const c=itemCost(id),m=mg(id)/100;return c>0&&m<1?Math.ceil(c/(1-m)/5)*5:0};
function up(a,i,k,v,n){a[i][k]=n?(+v||0):v;save();render()}
function nid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,4)}
function addLine(id){if(!S.ing.length)return toast('Add groceries first');(S.rec[id]=S.rec[id]||[]).push({ing:S.ing[0].id,qty:1});save();render()}
function useP(id){S.menu.find(m=>m.id===id).price=sug(id);save();render()}
function costView(){
 const sp=S.ing.reduce((a,i)=>a+(+i.cost||0),0),fx=S.fx.reduce((a,f)=>a+(+f.amt||0),0),out=sp+fx,
 ok=S.orders.filter(o=>!o.void),rev=ok.reduce((a,o)=>a+o.total,0),
 cogs=ok.reduce((a,o)=>a+o.items.reduce((b,i)=>{const m=S.menu.find(x=>x.name===i.name);return b+(m?itemCost(m.id)*i.qty:0)},0),0),
 need=out+(+S.goal||0),opt=sel=>S.ing.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name||'(unnamed)')}</option>`).join('');
 const H=t=>`<b style="font-weight:500">${t}</b>`;
 return`<div class="stats"><div>Total spent<b>${R(out)}</b></div><div>Sales so far<b>${R(rev)}</b></div><div>Net so far<b>${R(rev-out)}</b></div><div>Left to sell for your goal<b>${R(Math.max(0,need-rev))}</b></div><div>Gross profit on sold items<b>${R(rev-cogs)}</b></div></div>
 <div class="card">${H('Targets')}<div class="row" style="margin-top:10px"><span class="muted" style="width:230px">Profit goal for the whole pop-up (₱)</span><input type="number" inputmode="decimal" style="width:140px" value="${S.goal||''}" onchange="S.goal=+this.value||0;save();render()"></div>
 <div class="row"><span class="muted" style="width:230px">Default profit margin on each item (%)</span><input type="number" inputmode="decimal" style="width:140px" value="${S.margin}" onchange="S.margin=+this.value||0;save();render()"></div></div>
 <div class="card">${H('Groceries')}<p class="muted">What you paid, how much you bought, and the unit (pcs, kg, pack). Include packaging.</p>
 ${S.ing.map((g,i)=>`<div class="row"><input placeholder="Item" value="${esc(g.name)}" onchange="up(S.ing,${i},'name',this.value)"><input type="number" inputmode="decimal" placeholder="Paid ₱" style="width:110px" value="${g.cost||''}" onchange="up(S.ing,${i},'cost',this.value,1)"><input type="number" inputmode="decimal" placeholder="Qty" style="width:90px" value="${g.qty||''}" onchange="up(S.ing,${i},'qty',this.value,1)"><input placeholder="Unit" style="width:80px" value="${esc(g.unit)}" onchange="up(S.ing,${i},'unit',this.value)"><span class="muted" style="width:120px">${R(ic(g.id))} / ${esc(g.unit||'unit')}</span><button class="sm" onclick="S.ing.splice(${i},1);save();render()">Remove</button></div>`).join('')}
 <button class="sm" onclick="S.ing.push({id:nid('g'),name:'',cost:0,qty:1,unit:'pcs'});save();render()">Add grocery item</button></div>
 <div class="card">${H('Cost and price per menu item')}<p class="muted">Pick what goes into one serving. The app works out the cost and the price you need.</p></div>
 ${S.menu.map(m=>{const c=itemCost(m.id),pr=m.price-c,sg=sug(m.id);return`<div class="card"><div class="row">${H(esc(m.name))}<span class="muted" style="margin-left:auto">Cost ${R(c)} · Price ${P(m.price)} · Profit ${R(pr)}${m.price?' ('+Math.round(pr/m.price*100)+'%)':''}</span></div>
 ${(S.rec[m.id]||[]).map((r,j)=>{const g=S.ing.find(x=>x.id===r.ing);return`<div class="row"><select style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--st);background:#fff;font:inherit" onchange="up(S.rec['${m.id}'],${j},'ing',this.value)">${opt(r.ing)}</select><input type="number" inputmode="decimal" style="width:90px" value="${r.qty}" onchange="up(S.rec['${m.id}'],${j},'qty',this.value,1)"><span class="muted" style="width:60px">${esc(g?g.unit:'')}</span><span class="muted" style="width:80px">${R(ic(r.ing)*r.qty)}</span><button class="sm" onclick="S.rec['${m.id}'].splice(${j},1);save();render()">Remove</button></div>`}).join('')}
 <div class="row"><button class="sm" onclick="addLine('${m.id}')">Add ingredient</button><span class="muted" style="margin-left:auto">Margin %</span><input type="number" inputmode="decimal" style="width:80px" value="${mg(m.id)}" onchange="S.mi['${m.id}']=+this.value||0;save();render()">${sg?`<span>Suggested ${P(sg)} (profit ${R(sg-c)})</span><button class="sm" onclick="useP('${m.id}')">Use ${P(sg)}</button>`:'<span class="muted">Add ingredients to get a price</span>'}</div></div>`}).join('')}
 <div class="card">${H('Other costs')}<p class="muted">Booth fee, transport, ice, bags, anything that isn't a grocery.</p>
 ${S.fx.map((f,i)=>`<div class="row"><input placeholder="Expense" value="${esc(f.name)}" onchange="up(S.fx,${i},'name',this.value)"><input type="number" inputmode="decimal" placeholder="₱" style="width:130px" value="${f.amt||''}" onchange="up(S.fx,${i},'amt',this.value,1)"><button class="sm" onclick="S.fx.splice(${i},1);save();render()">Remove</button></div>`).join('')}
 <button class="sm" onclick="S.fx.push({id:nid('x'),name:'',amt:0});save();render()">Add expense</button></div>`}
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v==view));$('#ttl').textContent=S.biz.name;document.title=S.biz.name+' POS';
 $('#app').innerHTML=view=='sell'?sellView():view=='orders'?ordersView():view=='cost'?costView():setupView();badge();calc()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;render()});
addEventListener('online',()=>sync());addEventListener('offline',badge);setInterval(()=>sync(),60000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync();
</script></body></html>
